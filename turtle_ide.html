<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Turtle Student IDE</title>
    <!-- Brython Core and Standard Library from CDN -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.12.4/brython.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.12.4/brython_stdlib.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #bdc3c7;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #run-btn {
            background-color: #2ecc71;
            color: white;
        }
        #run-btn:hover {
            background-color: #27ae60;
        }
        #clear-btn {
            background-color: #e74c3c;
            color: white;
        }
        #clear-btn:hover {
            background-color: #c0392b;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: #fff;
        }
        .panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #left-panel {
            width: 45%;
            border-right: 2px solid #e2e8f0;
        }
        #right-panel {
            width: 55%;
            background: #fafafa;
        }
        .panel-header {
            background: #edf2f7;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a5568;
            border-bottom: 1px solid #e2e8f0;
        }
        textarea {
            width: 100%;
            flex: 1;
            padding: 12px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.5;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        #turtle-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            position: relative;
            overflow: auto;
        }
        /* Brython maps turtle directly to a div with this id */
        #turtle-div {
            border: 1px solid #e2e8f0;
            background: #fff;
        }
        #console-area {
            height: 150px;
            background-color: #151515;
            color: #ff5555;
            font-family: monospace;
            padding: 10px;
            overflow-y: auto;
            border-top: 2px solid #e2e8f0;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }
    </style>
</head>
<body onload="brython(1)">

    <header>
        <div>
            <h1>Python Turtle Studio</h1>
            <div class="subtitle">Classroom Sandbox Environment</div>
        </div>
        <div class="controls">
            <button id="run-btn">▶ Run Code</button>
            <button id="clear-btn">🧹 Clear Canvas</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Editor Panel -->
        <div class="panel" id="left-panel">
            <div class="panel-header">Python Code Editor</div>
            <textarea id="code-editor" spellcheck="false">import turtle

# Create your canvas and turtle
t = turtle.Turtle()
t.speed(3)

# Draw a colorful square pattern
colors = ["red", "blue", "green", "purple"]

for i in range(4):
    t.color(colors[i])
    t.forward(100)
    t.right(90)
</textarea>
        </div>

        <!-- Output Canvas & Console -->
        <div class="panel" id="right-panel">
            <div class="panel-header">Turtle Canvas Output</div>
            <div id="turtle-container">
                <div id="turtle-div"></div>
            </div>
            <div class="panel-header" style="background:#f7fafc; color:#e53e3e;">Console Errors</div>
            <div id="console-area"></div>
        </div>
    </div>

    <!-- Script to tie UI buttons to Brython execution -->
    <script type="text/javascript">
        document.getElementById('run-btn').addEventListener('click', function() {
            // Clear prior error console
            document.getElementById('console-area').innerText = '';
            
            // Trigger Brython script execution
            if (window.run_python) {
                window.run_python();
            }
        });

        document.getElementById('clear-btn').addEventListener('click', function() {
            const canvasDiv = document.getElementById('turtle-div');
            canvasDiv.innerHTML = '';
            document.getElementById('console-area').innerText = '';
        });
    </script>

    <!-- Inline Python processing via Brython -->
    <script type="text/python">
        from browser import document, window, sys

        # Setup custom error writing to redirect to our console UI
        class HTMLElementWriter:
            def __init__(self, element_id):
                self.element = document[element_id]
            def write(self, data):
                self.element.text += data
            def flush(self):
                pass

        sys.stderr = HTMLElementWriter('console-area')

        def execute_code():
            # Clean canvas target area implicitly handled or manual check
            # Inject target element mapping for Brython turtle module
            # Brython turtle framework defaults to looking for a canvas element or target div
            # Set target container window property
            window.turtle_canvas_id = "turtle-div"
            
            src = document['code-editor'].value
            try:
                exec(src, {})
            except Exception as e:
                sys.stderr.write(str(e) + "\n")

        # Expose python runner to JavaScript button trigger
        window.run_python = execute_code
    </script>

</body>
</html>
