<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyIDE</title>
  
  <!-- CodeMirror Editor CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <!-- CodeMirror Comment Addon -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/comment/comment.min.js"></script>

  <!-- Pyodide (Python WebAssembly Runtime) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1e1e2e;
      color: #f8f8f2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #282a36;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .title-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title-container h2 {
      line-height: 1;
    }

    .credit-text {
      font-size: 0.72rem;
      color: #6272a4;
      font-style: italic;
    }

    .status {
      font-size: 0.9rem;
      color: #f1fa8c;
    }

    .toolbar {
      display: flex;
      gap: 10px;
    }

    button {
      background: #50fa7b;
      color: #282a36;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background: #bd93f9;
    }

    .main-container {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 210px;
      grid-template-areas:
        "sidebar editor"
        "sidebar output";
      flex: 1;
      min-height: 0;
      min-width: 0;
      user-select: none;
      gap: 8px;
    }

    /* Resizer Bars */
    .resizer {
      display: none;
      width: 0;
      cursor: default;
      background: transparent;
      transition: background 0.2s;
      z-index: 10;
      flex-shrink: 0;
    }

    .resizer:hover, .resizer.dragging {
      background: #6272a4;
    }

    /* Sidebar Folder & File Tree UI */
    .sidebar-section {
      width: auto;
      min-width: 0;
      max-width: none;
      grid-area: sidebar;
      display: flex;
      flex-direction: column;
      background: #282a36;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .explorer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #44475a;
      padding: 6px 10px;
    }

    .explorer-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .explorer-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      color: #f8f8f2;
      border: 1px solid #6272a4;
      padding: 2px 6px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: #6272a4;
    }

    #sidebar-tree {
      flex: 1;
      overflow-y: auto;
    }

    .folder-group {
      margin-bottom: 2px;
    }

    .folder-header {
      padding: 8px 12px;
      background: #343746;
      font-weight: bold;
      font-size: 0.85rem;
      color: #f1fa8c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .folder-header:hover {
      background: #44475a;
    }

    .folder-label {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-icon {
      font-size: 0.75rem;
      width: 12px;
      display: inline-block;
      color: #8be9fd;
    }

    .item-actions {
      display: none;
      gap: 2px;
    }

    .folder-header:hover .item-actions,
    .file-item:hover .item-actions {
      display: flex;
    }

    .action-btn {
      font-size: 0.7rem;
      padding: 1px 4px;
      background: #6272a4;
      border: none;
      border-radius: 3px;
      color: #fff;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #bd93f9;
      color: #282a36;
    }

    .action-btn.delete-btn:hover {
      background: #ff5555;
      color: #fff;
    }

    .file-list {
      list-style: none;
      padding: 2px 0 4px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .file-list.collapsed {
      display: none;
    }

    .file-item {
      padding: 6px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      cursor: pointer;
      color: #f8f8f2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .file-label {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item:hover {
      background: #44475a;
    }

    .file-item.active {
      background: #6272a4;
      font-weight: bold;
      color: #50fa7b;
    }

    /* Context Menu Styles */
    .context-menu {
      position: absolute;
      background: #282a36;
      border: 1px solid #6272a4;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 4px 0;
      min-width: 130px;
    }

    .context-menu-item {
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #f8f8f2;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .context-menu-item:hover {
      background: #6272a4;
      color: #50fa7b;
    }

    .context-menu-item.danger:hover {
      background: #ff5555;
      color: #fff;
    }

    .editor-section, .output-section {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #282a36;
      border-radius: 8px;
      overflow: hidden;
    }

    .editor-section {
      grid-area: editor;
    }

    .output-section {
      grid-area: output;
    }

    .section-header {
      background: #44475a;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: 'Fira Code', monospace;
      font-size: 15px;
      line-height: 1.45;
    }

    #output {
      flex: 1;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-y: auto;
      background: #191a21;
      color: #f8f8f2;
    }

    /* Canvas-friendly responsive layout */
    @media (max-width: 700px) {
      body {
        padding: 8px;
        gap: 8px;
      }

      header {
        padding: 8px 10px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .credit-text {
        display: none;
      }

      .status {
        font-size: 0.8rem;
      }

      .toolbar {
        gap: 6px;
      }

      button {
        padding: 7px 10px;
        font-size: 0.85rem;
      }

      .main-container {
        grid-template-columns: 125px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) 180px;
      }

      .explorer-header {
        padding: 6px;
      }

      .explorer-actions {
        flex-direction: column;
      }

      .icon-btn {
        font-size: 0.65rem;
      }

      .file-item {
        padding: 5px 6px;
        font-size: 12px;
      }

      .folder-header {
        padding: 6px;
        font-size: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      .main-container {
        grid-template-columns: 1fr;
        grid-template-rows: 150px minmax(300px, 1fr) 170px;
        grid-template-areas:
          "sidebar"
          "editor"
          "output";
      }

      .sidebar-section {
        min-height: 0;
      }

      .toolbar button.secondary {
        display: none;
      }
    }

  </style>
</head>
<body onclick="hideContextMenu()">

  <header>
    <div class="title-container">
      <h2>Python IDE</h2>
      <span class="credit-text">Created with Google Gemini</span>
    </div>
    <span id="status" class="status" style="color: rgb(241, 250, 140);">Loading Python Runtime...</span>
    <div class="toolbar">
      <button id="run-btn" onclick="runCode()" disabled="">▶ Run Code</button>
      <button class="secondary" onclick="saveSelfHTML()">💾 Save IDE State (.html)</button>
    </div>
  </header>

  <div class="main-container">
    <!-- Project Folder Sidebar -->
    <div class="sidebar-section" id="sidebar-pane">
      <div class="explorer-header">
        <span class="explorer-title">Explorer</span>
        <div class="explorer-actions">
          <button class="icon-btn" onclick="createNewFolder()" title="Create New Folder/Project">+ Folder</button>
          <button class="icon-btn" onclick="createNewFile()" title="Create File in Active Folder">+ File</button>
        </div>
      </div>
      <div id="sidebar-tree"></div>
    </div>

    <!-- Resizer 1 (Between Sidebar & Editor) -->
    <div class="resizer" id="resizer-1"></div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu" style="display: none;">
      <div id="ctx-rename" class="context-menu-item">✏️ Rename</div>
      <div id="ctx-delete" class="context-menu-item danger">🗑️ Delete</div>
    </div>

    <!-- Editor Section -->
    <div class="editor-section" id="editor-pane">
      <div id="editor-header" class="section-header">Editor — DemoFileIO / main.py</div>
      <textarea id="code-editor" style="display: none;"></textarea>
    </div>

    <!-- Resizer 2 (Between Editor & Console) -->
    <div class="resizer" id="resizer-2"></div>

    <!-- Console Section -->
    <div class="output-section" id="output-pane">
      <div class="section-header">Console Output</div>
      <div id="output">Initialize code and press Run...</div>
    </div>
  </div>

  <!-- Custom Input Dialog Modal -->
  <div id="input-modal" style="display: none; position: fixed; inset: 0px; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: #282a36; border: 1px solid #6272a4; padding: 18px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 10px;">
      <label id="input-modal-prompt" style="font-family: monospace; color: #f8f8f2; font-size: 14px;">Enter something to add: </label>
      <input type="text" id="input-modal-field" style="background: #191a21; color: #f8f8f2; border: 1px solid #6272a4; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 14px;">
      <button id="input-modal-submit" style="background: #50fa7b; color: #282a36; font-weight: bold; padding: 6px; border: none; border-radius: 4px; cursor: pointer;">Submit</button>
    </div>
  </div>

  <!-- Multi-Project Folder Structure -->
  <script id="embedded-projects" type="application/json">
{
  "DemoFunctions": {
    "main.py": "# Calculator App Entry Point\nimport math_utils\n\nx, y = 10, 5\nans = math_utils.add(x, y)\nprint(\"Add: \", ans)\n\n",
    "math_utils.py": "# Math Helpers Module\n\ndef add(a, b):\n    return a + b\n\ndef multiply(a, b):\n    return a * b\n",
    "README.txt": "To save your work, click Save IDE State (.html) in the top right. \n\nThis will download an updated .html file containing \nyour latest code and project structure. \n\nOpen this new file next time you resume working, \nand repeat the process whenever you save."
  },
  "DemoFileIO": {
    "main.py": "# Read from file\nf = open(\"file.txt\", \"r\")\nall_data = f.read()\nprint(\"Current file contents:\\n\", all_data)\nf.close()\n\n# Write to file with input\ntemp = input(\"Enter something to add: \")\nf = open(\"file.txt\", \"a\")\nf.write(\"\\n\"+temp)\nf.close()\nprint(\"\\nSuccessfully wrote to file.txt!\")",
    "file.txt": "potato"
  }
}
</script>

  <script>
    let pyodide;
    let isPyodideReady = false;
    let projects = {};
    let collapsedFolders = {}; 
    let activeProject = "";
    let activeFile = "";

    function updateRunButtonState() {
      const runBtn = document.getElementById("run-btn");
      const isPythonFile = activeFile.toLowerCase().endsWith(".py");
      runBtn.disabled = !(isPyodideReady && isPythonFile);
    }

    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
      mode: "python",
      theme: "dracula",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      extraKeys: {
    "Ctrl-/": "toggleComment",
    "Cmd-/": "toggleComment"
  }
    });

    /* Resizers are disabled in the Canvas layout.
       The editor uses the full available width instead. */
    function initResizers() {
      // Intentionally empty for the Canvas-friendly layout.
    }

    initResizers();

    try {
      const container = document.getElementById("embedded-projects");
      projects = JSON.parse(container.textContent);
      
      const firstProj = Object.keys(projects)[0];
      if (firstProj) {
        activeProject = firstProj;
        activeFile = Object.keys(projects[firstProj])[0] || "";
      }
    } catch (err) {
      console.error("Failed to parse embedded project structure", err);
      projects = { "DefaultProject": { "main.py": "print('Hello World')" } };
      activeProject = "DefaultProject";
      activeFile = "main.py";
    }

    function createNewFolder() {
      const folderName = prompt("Enter new folder/project name:");
      if (!folderName) return;

      const cleanName = folderName.trim().replace(/[^a-zA-Z0-9_\-]/g, "");
      if (!cleanName) {
        alert("Invalid folder name.");
        return;
      }

      if (projects[cleanName]) {
        alert("A folder with this name already exists.");
        return;
      }

      projects[cleanName] = {
        "main.py": `# Main script for ${cleanName}\nprint("Hello from ${cleanName}!")\n`
      };

      activeProject = cleanName;
      activeFile = "main.py";

      editor.setValue(projects[activeProject][activeFile]);
      renderSidebar();
      updateHeader();
      updateRunButtonState();
    }

    function createNewFile(targetProject = activeProject) {
      if (!projects[targetProject]) {
        alert("Please select or create a folder first.");
        return;
      }

      let fileName = prompt(`Create new file in '${targetProject}':`);
      if (!fileName) return;

      fileName = fileName.trim();
      if (!fileName.endsWith(".py") && !fileName.includes(".")) {
        fileName += ".py";
      }

      if (projects[targetProject][fileName] !== undefined) {
        alert("A file with this name already exists in this folder.");
        return;
      }

      projects[targetProject][fileName] = "# New python script\n";
      collapsedFolders[targetProject] = false;
      switchFile(targetProject, fileName);
    }

    function renameFolder(oldName) {
      const newName = prompt(`Rename folder '${oldName}' to:`, oldName);
      if (!newName || newName.trim() === oldName) return;

      const cleanName = newName.trim().replace(/[^a-zA-Z0-9_\-]/g, "");
      if (!cleanName) {
        alert("Invalid folder name.");
        return;
      }

      if (projects[cleanName]) {
        alert("A folder with this name already exists.");
        return;
      }

      if (projects[activeProject] && projects[activeProject][activeFile] !== undefined) {
        projects[activeProject][activeFile] = editor.getValue();
      }

      projects[cleanName] = projects[oldName];
      delete projects[oldName];

      collapsedFolders[cleanName] = collapsedFolders[oldName];
      delete collapsedFolders[oldName];

      if (activeProject === oldName) {
        activeProject = cleanName;
      }

      renderSidebar();
      updateHeader();
      updateRunButtonState();
    }

    function renameFile(projectName, oldFileName) {
      let newFileName = prompt(`Rename '${oldFileName}' to:`, oldFileName);
      if (!newFileName || newFileName.trim() === oldFileName) return;

      newFileName = newFileName.trim();
      if (!newFileName.endsWith(".py") && !newFileName.includes(".")) {
        newFileName += ".py";
      }

      if (projects[projectName][newFileName] !== undefined) {
        alert("A file with this name already exists in this folder.");
        return;
      }

      if (projectName === activeProject && oldFileName === activeFile) {
        projects[activeProject][activeFile] = editor.getValue();
      }

      projects[projectName][newFileName] = projects[projectName][oldFileName];
      delete projects[projectName][oldFileName];

      if (projectName === activeProject && activeFile === oldFileName) {
        activeFile = newFileName;
      }

      renderSidebar();
      updateHeader();
      updateRunButtonState();
    }

    function deleteFolder(projName) {
      if (!confirm(`Are you sure you want to delete folder '${projName}' and all its files?`)) return;

      delete projects[projName];
      delete collapsedFolders[projName];

      const remainingProjects = Object.keys(projects);
      if (remainingProjects.length > 0) {
        activeProject = remainingProjects[0];
        activeFile = Object.keys(projects[activeProject])[0] || "";
        editor.setValue(projects[activeProject][activeFile] || "");
      } else {
        activeProject = "";
        activeFile = "";
        editor.setValue("# No projects available.");
      }

      renderSidebar();
      updateHeader();
      updateRunButtonState();
    }

    function deleteFile(projectName, fileName) {
      if (!confirm(`Are you sure you want to delete '${fileName}'?`)) return;

      delete projects[projectName][fileName];

      if (projectName === activeProject && fileName === activeFile) {
        const remainingFiles = Object.keys(projects[projectName]);
        if (remainingFiles.length > 0) {
          activeFile = remainingFiles[0];
          editor.setValue(projects[activeProject][activeFile]);
        } else {
          activeFile = "";
          editor.setValue("# No files in this project.");
        }
      }

      renderSidebar();
      updateHeader();
      updateRunButtonState();
    }

    function showContextMenu(e, type, projName, fileName = null) {
      e.preventDefault();
      e.stopPropagation();

      const menu = document.getElementById("context-menu");
      const ctxRename = document.getElementById("ctx-rename");
      const ctxDelete = document.getElementById("ctx-delete");

      menu.style.top = `${e.clientY}px`;
      menu.style.left = `${e.clientX}px`;
      menu.style.display = "flex";

      if (type === "folder") {
        ctxRename.onclick = () => { renameFolder(projName); hideContextMenu(); };
        ctxDelete.onclick = () => { deleteFolder(projName); hideContextMenu(); };
      } else if (type === "file") {
        ctxRename.onclick = () => { renameFile(projName, fileName); hideContextMenu(); };
        ctxDelete.onclick = () => { deleteFile(projName, fileName); hideContextMenu(); };
      }
    }

    function hideContextMenu() {
      document.getElementById("context-menu").style.display = "none";
    }

    function toggleFolder(projName) {
      collapsedFolders[projName] = !collapsedFolders[projName];
      renderSidebar();
    }

    function renderSidebar() {
      const treeContainer = document.getElementById("sidebar-tree");
      treeContainer.innerHTML = "";

      for (const [projName, files] of Object.entries(projects)) {
        const folderDiv = document.createElement("div");
        folderDiv.className = "folder-group";

        const isCollapsed = !!collapsedFolders[projName];
        const arrow = isCollapsed ? "▶" : "▼";

        const folderHeader = document.createElement("div");
        folderHeader.className = "folder-header";
        
        folderHeader.innerHTML = `
          <span class="folder-label">
            <span class="folder-icon">${arrow}</span> 📁 ${projName}
          </span>
          <div class="item-actions">
            <button class="action-btn" title="Rename folder">✏️</button>
            <button class="action-btn" title="Add file">+ File</button>
          </div>
        `;

        folderHeader.onclick = () => toggleFolder(projName);
        folderHeader.oncontextmenu = (e) => showContextMenu(e, "folder", projName);

        const actionsDiv = folderHeader.querySelector(".item-actions");
        const [renameBtn, addBtn] = actionsDiv.querySelectorAll(".action-btn");
        
        renameBtn.onclick = (e) => {
          e.stopPropagation();
          renameFolder(projName);
        };

        addBtn.onclick = (e) => {
          e.stopPropagation();
          createNewFile(projName);
        };

        folderDiv.appendChild(folderHeader);

        const fileList = document.createElement("ul");
        fileList.className = `file-list ${isCollapsed ? "collapsed" : ""}`;

        for (const fileName of Object.keys(files)) {
          const fileItem = document.createElement("li");
          fileItem.className = "file-item";
          if (projName === activeProject && fileName === activeFile) {
            fileItem.classList.add("active");
          }

          fileItem.innerHTML = `
            <span class="file-label">📄 ${fileName}</span>
            <div class="item-actions">
              <button class="action-btn" title="Rename file">✏️</button>
              <button class="action-btn delete-btn" title="Delete file">🗑️</button>
            </div>
          `;

          fileItem.onclick = (e) => {
            e.stopPropagation();
            switchFile(projName, fileName);
          };

          fileItem.oncontextmenu = (e) => showContextMenu(e, "file", projName, fileName);

          const fileActions = fileItem.querySelector(".item-actions");
          const [renameFileBtn, deleteFileBtn] = fileActions.querySelectorAll(".action-btn");

          renameFileBtn.onclick = (e) => {
            e.stopPropagation();
            renameFile(projName, fileName);
          };

          deleteFileBtn.onclick = (e) => {
            e.stopPropagation();
            deleteFile(projName, fileName);
          };

          fileList.appendChild(fileItem);
        }

        folderDiv.appendChild(fileList);
        treeContainer.appendChild(folderDiv);
      }
    }

    if (projects[activeProject] && projects[activeProject][activeFile]) {
      editor.setValue(projects[activeProject][activeFile]);
    }
    renderSidebar();
    updateHeader();
    updateRunButtonState();

    editor.on("change", () => {
      if (projects[activeProject] && projects[activeProject][activeFile] !== undefined) {
        projects[activeProject][activeFile] = editor.getValue();
      }
    });

    function updateHeader() {
      document.getElementById("editor-header").textContent = `Editor — ${activeProject} / ${activeFile}`;
    }

    function switchFile(projectName, fileName) {
      if (projects[activeProject] && projects[activeProject][activeFile] !== undefined) {
        projects[activeProject][activeFile] = editor.getValue();
      }

      activeProject = projectName;
      activeFile = fileName;

      editor.setValue(projects[activeProject][activeFile] || "");
      renderSidebar();
      updateHeader();
      updateRunButtonState();
    }

    async function initPyodide() {
      try {
        window.customPyInputAsync = (promptText) => {
          return new Promise((resolve) => {
            const modal = document.getElementById("input-modal");
            const label = document.getElementById("input-modal-prompt");
            const inputField = document.getElementById("input-modal-field");
            const submitBtn = document.getElementById("input-modal-submit");
            
            label.textContent = promptText || "Input requested:";
            inputField.value = "";
            modal.style.display = "flex";
            
            setTimeout(() => inputField.focus(), 50);
            
            const handleSubmit = () => {
              const value = inputField.value;
              modal.style.display = "none";
              submitBtn.removeEventListener("click", handleSubmit);
              inputField.removeEventListener("keydown", handleKeyDown);
              resolve(value);
            };
            
            const handleKeyDown = (e) => {
              if (e.key === "Enter") handleSubmit();
            };
            
            submitBtn.addEventListener("click", handleSubmit);
            inputField.addEventListener("keydown", handleKeyDown);
          });
        };
        
        pyodide = await loadPyodide({
          stdout: (text) => appendOutput(text + "\n"),
          stderr: (text) => appendOutput(`Error: ${text}\n`),
        });
        
        await pyodide.runPythonAsync(`
          import builtins
          import js
          import sys
          
          async def custom_input(prompt_msg=""):
              sys.stdout.flush()
              return await js.customPyInputAsync(str(prompt_msg))
          
          builtins.input = custom_input
        `);
        
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        
        document.getElementById("status").innerText = "Installing network packages...";
        await micropip.install(['requests', 'pyodide-http']);
        
        await pyodide.runPythonAsync(`
          import pyodide_http
          pyodide_http.patch_all()
        `);
        
        isPyodideReady = true;
        document.getElementById("status").innerText = "Python Ready";
        document.getElementById("status").style.color = "#50fa7b";
        updateRunButtonState();
      } catch (err) {
        console.error(err);
        document.getElementById("status").innerText = "Failed to load Python engine.";
        document.getElementById("status").style.color = "#ff5555";
      }
    }

    function appendOutput(text) {
      const outputDiv = document.getElementById("output");
      outputDiv.textContent += text;
      outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    async function runCode() {
      const outputDiv = document.getElementById("output");
      outputDiv.textContent = "";
      
      if (projects[activeProject] && projects[activeProject][activeFile] !== undefined) {
        projects[activeProject][activeFile] = editor.getValue();
      }
      
      try {
        const existingFSFiles = pyodide.FS.readdir('.').filter(f => !f.startsWith('.'));
        for (const filename of existingFSFiles) {
          try {
            const stat = pyodide.FS.stat(filename);
            if (pyodide.FS.isFile(stat.mode) && !pyodide.FS.isDir(stat.mode)) {
              pyodide.FS.unlink(filename);
            }
          } catch (e) {}
        }
        
        const activeFolderFiles = projects[activeProject];
        for (const [filename, content] of Object.entries(activeFolderFiles)) {
          pyodide.FS.writeFile(filename, content);
        }
        
        const userCode = projects[activeProject][activeFile];
        const wrappedCode = `
    import ast
    import sys
    import builtins
    
    code_str = ${JSON.stringify(userCode)}
    
    class InputAwaitTransformer(ast.NodeTransformer):
        def visit_Call(self, node):
            self.generic_visit(node)
            if isinstance(node.func, ast.Name) and node.func.id == 'input':
                return ast.Await(value=node)
            return node
    
    parsed_ast = ast.parse(code_str, filename="${activeFile}")
    
    async_func = ast.AsyncFunctionDef(
        name="_user_async_main",
        args=ast.arguments(posonlyargs=[], args=[], vararg=None, kwonlyargs=[], kw_defaults=[], kwarg=None, defaults=[]),
        body=parsed_ast.body,
        decorator_list=[],
        returns=None
    )
    
    transformer = InputAwaitTransformer()
    transformed_func = transformer.visit(async_func)
    
    mod = ast.Module(body=[transformed_func], type_ignores=[])
    ast.fix_missing_locations(mod)
    
    globs = {"__name__": "__main__"}
    exec(compile(mod, filename="${activeFile}", mode="exec"), globs)
    await globs["_user_async_main"]()
    `;
    
        await pyodide.runPythonAsync(wrappedCode);
        
        const filesInPyodide = pyodide.FS.readdir('.').filter(f => !f.startsWith('.'));
        for (const filename of filesInPyodide) {
          try {
            const stat = pyodide.FS.stat(filename);
            if (pyodide.FS.isFile(stat.mode) && !pyodide.FS.isDir(stat.mode)) {
              const content = pyodide.FS.readFile(filename, { encoding: 'utf8' });
              projects[activeProject][filename] = content;
            }
          } catch (err) {}
        }
        
        renderSidebar();
        
      } catch (err) {
        appendOutput(`\nRuntime Error:\n${err.message}`);
      }
    }

    function saveSelfHTML() {
      if (projects[activeProject] && projects[activeProject][activeFile] !== undefined) {
        projects[activeProject][activeFile] = editor.getValue();
      }

      const docClone = document.documentElement.cloneNode(true);

      const cmWrapper = docClone.querySelector(".CodeMirror");
      if (cmWrapper) cmWrapper.remove();

      const textarea = docClone.querySelector("#code-editor");
      if (textarea) textarea.value = "";

      const embeddedScript = docClone.querySelector("#embedded-projects");
      if (embeddedScript) {
        embeddedScript.textContent = "\n" + JSON.stringify(projects, null, 2) + "\n";
      }

      const outputDiv = docClone.querySelector("#output");
      if (outputDiv) outputDiv.textContent = "Initialize code and press Run...";

      const statusSpan = docClone.querySelector("#status");
      if (statusSpan) {
        statusSpan.textContent = "Loading Python Runtime...";
        statusSpan.style.color = "#f1fa8c";
      }

      const runBtn = docClone.querySelector("#run-btn");
      if (runBtn) runBtn.disabled = true;

      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const dateString = `${yy}${mm}${dd}`;

      const filename = `python_ide_${dateString}.html`;
      const updatedHTML = "<!DOCTYPE html>\n" + docClone.outerHTML;
      const blob = new Blob([updatedHTML], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    initPyodide();
  </script>
